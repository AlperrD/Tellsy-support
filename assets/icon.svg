<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tellsy app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151923"/>
      <stop offset="0.55" stop-color="#0A0C11"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#4A566A"/>
      <stop offset="0.5" stop-color="#2D3543"/>
      <stop offset="1" stop-color="#141922"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343D4C"/>
      <stop offset="1" stop-color="#1B212B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0453A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F0453A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <circle cx="398" cy="136" r="86" fill="url(#glow)"/>

  <!-- teleprompter / flip screen -->
  <g transform="rotate(12 420 280)" filter="url(#softShadow)">
    <rect x="380" y="202" width="90" height="158" rx="26" fill="url(#screen)" stroke="#59657A" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M401 240h50M401 262h50M401 284h34" stroke="#98A4B8" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- camera body -->
  <g filter="url(#softShadow)">
    <circle cx="244" cy="238" r="146" fill="none" stroke="#F8F7F3" stroke-width="34"/>
  </g>

  <!-- lens -->
  <circle cx="244" cy="238" r="112" fill="#0D1118"/>
  <circle cx="244" cy="238" r="101" fill="#1B2230"/>
  <circle cx="244" cy="238" r="86" fill="url(#lens)"/>
  <circle cx="244" cy="238" r="61" fill="#151B25"/>
  <path d="M199 278c8 22 28 38 52 42" fill="none" stroke="#6B778C" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <circle cx="214" cy="205" r="23" fill="#F8F7F3"/>
  <circle cx="214" cy="205" r="23" fill="none" stroke="#0A0C11" stroke-opacity="0.12" stroke-width="3"/>

  <!-- record light -->
  <circle cx="394" cy="136" r="31" fill="#F0453A"/>
  <circle cx="394" cy="136" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
</svg>
